        '</div>' +
        '<span class="fs" id="fsNow"></span>' +
        '<button class="plain" id="btnMk" aria-expanded="false">Cuvinte marcate</button>' +
        '<div class="sep"></div>' +
        '<div class="find"><input id="inq" type="search" placeholder="Caută în această sondă" value="' + esc(S.inQuery) + '"></div>' +
        '<span class="cnt" id="cnt"></span>' +
        '<button class="plain" id="btnPrint">Tipărește</button>' +
      '</div>' +
      '<div class="mkpanel" id="mkpanel" hidden></div>' +
    '</div>' +
    '<div class="sheet" id="sheet"></div>';
  if(d.issues && d.issues.length){
    $('#sheet').insertAdjacentHTML('beforebegin', '<div class="sheet" style="padding-bottom:0"><p class="docwarn"><b>De verificat în fișier:</b> ' +
      d.issues.map(function(q){ return esc(q.text); }).join('; ') + '.</p></div>');
  }
  applyLook();
  wireMarkers();

  Array.prototype.forEach.call($('#main').querySelectorAll('[data-view]'), function(b){
    b.onclick = function(){
      S.view = b.dataset.view; applyLook();
      Array.prototype.forEach.call($('#main').querySelectorAll('[data-view]'), function(x){
        x.setAttribute('aria-pressed', String(x === b));
      });
    };
  });
  Array.prototype.forEach.call($('#main').querySelectorAll('[data-den]'), function(b){
    b.onclick = function(){
      S.density = b.dataset.den; applyLook();
      Array.prototype.forEach.call($('#main').querySelectorAll('[data-den]'), function(x){
        x.setAttribute('aria-pressed', String(x === b));
      });
    };
  });
  $('#btnMono').onclick = function(){
    S.mono = !S.mono; applyLook(); $('#btnMono').setAttribute('aria-pressed', String(S.mono));
  };
  $('#fsDown').onclick = function(){ if(S.fsDelta > FS_MIN){ S.fsDelta--; applyLook(); } };
  $('#btnMk').onclick = function(e){
    e.stopPropagation();
    var pan = $('#mkpanel'), open = pan.hidden;
    pan.hidden = !open; $('#btnMk').setAttribute('aria-expanded', String(open));
    if(open) renderMarkers();
  };
  $('#fsUp').onclick   = function(){ if(S.fsDelta < FS_MAX){ S.fsDelta++; applyLook(); } };
  $('#btnPrint').onclick = function(){ window.print(); };

  var inq = $('#inq'), t2 = null;
  inq.oninput = function(){
    clearTimeout(t2);
    t2 = setTimeout(function(){ S.inQuery = inq.value; renderSheet(); }, 200);
  };
  renderSheet();
}

/* Doar zilele se redesenează la schimbarea intervenției sau a căutării interne,
   așa că bara de unelte nu clipește și cursorul rămâne în casetă. */
function renderSheet(){
  var d = S.doc, tl = terms(S.inQuery), hits = 0;
  var list = S.sel === 'all' ? S.periods : S.periods.filter(function(p){ return p.id === S.sel; });

  var sheets = list.map(function(p){
    var days = p.entries.map(function(e,i){
      if(!catPass(e, d)) return '';
      if(tl.length){
        var f = W.fold(e.text), okAll = true;
        for(var t=0;t<tl.length;t++){ if(f.indexOf(tl[t])<0){ okAll = false; break; } }
        if(okAll) hits++;
      }
      return dayHtml(e, i+1, tl, p.id);
    }).join('');
    return '<section class="period">' +
      '<h3><span class="k" style="background:' + colorOf(p.cat || d.category) + '" title="' + esc(catTitle(p.cat || d.category, d.category)) + '">' + esc(p.label) + '</span>' +
      '<span class="r">' + W.fmtDate(p.start) + ' – ' + W.fmtDate(p.end) + '</span>' +
      '<span class="r">' + p.entries.length + ' ' + plural(p.entries.length,'zi','zile','de zile') + ' raportate</span>' +
      '<span class="r">' + p.days + ' ' + plural(p.days,'zi','zile','de zile') + ' calendaristice</span></h3>' +
      '<div class="grid">' + days + '</div></section>';
  }).join('');

  if(!sheets) sheets = '<p class="none">Această intervenție nu are zile raportate.</p>';
  if(d.undated && d.undated.length && S.sel === 'all'){
    sheets += '<section class="period undated"><h3><span class="k">Fără dată</span>' +
      '<span class="r">' + d.undated.length + ' ' + plural(d.undated.length,'rând','rânduri','de rânduri') +
      ' din fișier, cu data scrisă într-o formă pe care programul nu o poate citi sigur</span></h3><div class="grid">' +
      d.undated.map(function(e){
        return '<article class="day" style="border-left-color:var(--grey)"><h4><span>' + (esc(e.dateRaw) || '(fără dată)') +
          '</span><span class="zi">dată nerecunoscută</span></h4><p>' + markup(e.text, tl) + '</p></article>';
      }).join('') + '</div></section>';
  }
  $('#sheet').innerHTML = sheets;
  $('#cnt').textContent = tl.length
    ? hits + ' ' + plural(hits,'zi găsită','zile găsite','de zile găsite')
    : '';
}

var MK_COLORS = ['#a8480a','#203d88','#067a4a','#1a7f9c','#4a5468','#7a1f4b','#8a6d00'];

function renderMarkers(){
  var pan = $('#mkpanel');
  if(!pan) return;
  pan.innerHTML = '<h5>Cuvintele evidențiate în rapoarte</h5>' +
    S.markers.map(function(m, i){
      return '<div class="mkrow">' +
        '<input type="checkbox" data-on="' + i + '"' + (m.on ? ' checked' : '') + ' aria-label="Arată ' + esc(m.word) + '">' +
        '<input type="color" data-col="' + i + '" value="' + m.color + '" aria-label="Culoarea pentru ' + esc(m.word) + '">' +
        '<span class="w">' + (m.id === 'abd' ? '<b>ABD</b> — abandonată<span class="note">zilele de la primul „abandonare” sau „expert” până la finalul intervenției (din 01.09.2026)</span>' : esc(m.word)) + '</span>' +
        (m.id.charAt(0) === 'u' ? '<button class="del" data-del="' + i + '" title="Scoate cuvântul" aria-label="Scoate ' + esc(m.word) + '">&times;</button>' : '') +
        '</div>';
    }).join('') +
    '<div class="mkadd"><input id="mkNew" placeholder="alt cuvânt" maxlength="24">' +
    '<button id="mkAdd">Adaugă</button></div>' +
    '<button class="reset" id="mkReset">Revino la lista implicită</button>';

  function save(){
    kvSet('markers', markersToSave());
    renderMarkers();
    if(S.mode === 'cal'){ renderCalDay(); return; }
    renderRail(); renderSheet();
  }
  Array.prototype.forEach.call(pan.querySelectorAll('[data-on]'), function(c){
    c.onchange = function(){ S.markers[+c.dataset.on].on = c.checked; save(); };
  });
  Array.prototype.forEach.call(pan.querySelectorAll('[data-col]'), function(c){
    c.onchange = function(){ S.markers[+c.dataset.col].color = c.value; save(); };
  });
  Array.prototype.forEach.call(pan.querySelectorAll('[data-del]'), function(b){
    b.onclick = function(){ S.markers.splice(+b.dataset.del, 1); save(); };
  });
  $('#mkAdd').onclick = function(){
    var v = $('#mkNew').value.trim();
    if(!v) return;
    var stem = W.fold(v);
    if(S.markers.some(function(m){ return (m.stem || W.fold(m.word)) === stem; })){ $('#mkNew').value = ''; return; }
    S.markers.push({ id:'u' + Date.now(), word:v, stem:stem, mode:'stem',
                     color:MK_COLORS[S.markers.length % MK_COLORS.length], tint:false, on:true });
    save();
  };
  $('#mkNew').onkeydown = function(e){ if(e.key === 'Enter') $('#mkAdd').onclick(); };
  $('#mkReset').onclick = function(){
    S.markers = W.DEFAULT_MARKERS.map(function(m){ return copyMarker(m); });
    save();
  };
}

function wireMarkers(){
  var pan = $('#mkpanel');
  if(pan) pan.onclick = function(e){ e.stopPropagation(); };
}

/* ================= pagina Calendar ================= */
var LUNI = ['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
var ZILE = ['duminică','luni','marți','miercuri','joi','vineri','sâmbătă'];

function enableModes(on){
  Array.prototype.forEach.call(document.querySelectorAll('.mode'), function(b){ b.disabled = !on; });
  syncModes();
}
function syncModes(){
  Array.prototype.forEach.call(document.querySelectorAll('.mode'), function(b){
    b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode));
  });
}
function setMode(m){
  if(!S.docs.length) return;
  S.mode = m; syncModes(); closeSearch();
  if(m === 'cal'){ openCalendar(); return; }
  if(S.doc){ renderRail(); renderDoc(); }
  else { $('#rail').classList.add('hide'); showEmpty(null); }
}

function ensureDayIndex(){
  if(!S.dix) S.dix = W.buildDayIndex(S.docs, S.gap);
  return S.dix;
}
function recs(key){ return W.dayRecords(ensureDayIndex(), key, S.cat); }

function openCalendar(){
  var ix = ensureDayIndex();
  if(!S.calKey) S.calKey = W.dayKey(new Date());      // implicit: data curentă
  var d = W.keyToDate(S.calKey);
  S.calMonth = new Date(d.getFullYear(), d.getMonth(), 1, 12);
  renderCalendar();
}
function selectDay(key){
  S.calKey = key;
  var d = W.keyToDate(key);
  S.calMonth = new Date(d.getFullYear(), d.getMonth(), 1, 12);
  renderCalendar();
}
function shiftDay(n){
  var d = W.keyToDate(S.calKey); d.setDate(d.getDate() + n);
  selectDay(W.dayKey(d));
}
function shiftMonth(n){
  var m = S.calMonth;
  S.calMonth = new Date(m.getFullYear(), m.getMonth() + n, 1, 12);
  renderCalRail();
}
function renderCalendar(){ renderCalRail(); renderCalDay(); }

function renderCalRail(){
  var ix = ensureDayIndex(), rail = $('#rail'), m = S.calMonth;
  rail.classList.remove('hide');
  var y = m.getFullYear(), mo = m.getMonth();
  var firstDow = (new Date(y, mo, 1, 12).getDay() + 6) % 7;        // luni = 0
  var nDays = new Date(y, mo + 1, 0).getDate();
  var todayKey = W.dayKey(new Date());

  var cells = '', dayCount = 0, wells = {};
  for(var i = 0; i < firstDow; i++) cells += '<td><span class="d out"></span></td>';
  for(var dd = 1; dd <= nDays; dd++){
    var key = W.dayKey(new Date(y, mo, dd, 12)), r = recs(key), n = r.length;
    if(n){ dayCount++; r.forEach(function(x){ wells[x.doc.category + '|' + x.doc.well] = 1; }); }
    var lvl = n === 0 ? '' : n === 1 ? ' l1' : n <= 3 ? ' l2' : ' l3';
    cells += '<td><button class="d' + lvl + (key === S.calKey ? ' sel' : '') + (key === todayKey ? ' today' : '') +
      '" data-k="' + key + '" title="' + W.fmtDate(W.keyToDate(key)) + (n ? ': ' + n + ' ' + plural(n,'sondă','sonde','de sonde') : ': fără lucrări') + '">' +
      '<b>' + dd + '</b>' + (n ? '<small>' + n + '</small>' : '') + '</button></td>';
    if((firstDow + dd) % 7 === 0 && dd < nDays) cells += '</tr><tr>';
  }
  var tail = (7 - (firstDow + nDays) % 7) % 7;
  for(var t = 0; t < tail; t++) cells += '<td><span class="d out"></span></td>';

  var y0 = ix.first ? ix.first.getFullYear() : y, y1 = ix.last ? ix.last.getFullYear() : y;
  y0 = Math.min(y0, y); y1 = Math.max(y1, y, new Date().getFullYear());
  var yOpts = '';
  for(var yy = y1; yy >= y0; yy--) yOpts += '<option' + (yy === y ? ' selected' : '') + '>' + yy + '</option>';
  var mOpts = LUNI.map(function(nm, k){ return '<option value="' + k + '"' + (k === mo ? ' selected' : '') + '>' + nm + '</option>'; }).join('');

  var prev = W.nearestDay(ix, S.calKey, -1, S.cat), next = W.nearestDay(ix, S.calKey, 1, S.cat);
  var nw = Object.keys(wells).length;

  rail.innerHTML =
    '<div class="cal">' +
      '<h2>Calendar lucrări</h2>' +
      '<div class="nav">' +
        '<button class="arrow" id="cPrevM" title="Luna anterioară" aria-label="Luna anterioară">&lsaquo;</button>' +
        '<select class="mo" id="cMon" aria-label="Luna">' + mOpts + '</select>' +
        '<select id="cYear" aria-label="Anul">' + yOpts + '</select>' +
        '<button class="arrow" id="cNextM" title="Luna următoare" aria-label="Luna următoare">&rsaquo;</button>' +
      '</div>' +
      '<table><thead><tr><th>Lu</th><th>Ma</th><th>Mi</th><th>Jo</th><th>Vi</th><th>Sâ</th><th>Du</th></tr></thead>' +
      '<tbody><tr>' + cells + '</tr></tbody></table>' +
      '<div class="scale"><span>Sonde pe zi:</span>' +
        '<i style="background:#dfe7f6"></i>1 <i style="background:#a9bde6"></i>2–3 <i style="background:var(--blue)"></i>4+</div>' +
      '<div class="jump">' +
        '<button id="cPrevD"' + (prev ? '' : ' disabled') + ' title="' + (prev ? W.fmtDate(W.keyToDate(prev)) : '') + '">&lsaquo; Zi anterioară cu lucrări</button>' +
        '<button id="cNextD"' + (next ? '' : ' disabled') + ' title="' + (next ? W.fmtDate(W.keyToDate(next)) : '') + '">Zi următoare cu lucrări &rsaquo;</button>' +
      '</div>' +
      '<label class="go">Mergi la data <input type="date" id="cDate" value="' + S.calKey + '"></label>' +
      '<div class="stats">În ' + LUNI[mo] + ' ' + y + ': <b>' + dayCount + '</b> ' + plural(dayCount,'zi','zile','de zile') +
        ' cu lucrări, <b>' + nw + '</b> ' + plural(nw,'sondă','sonde','de sonde') + '.' +
        (S.cat !== 'ALL' ? ' Doar ' + (S.cat === 'GRK' ? 'folderul RK' : S.cat) + '.' : '') + '</div>' +
      '<p class="keys">Săgețile mută ziua, Page Up și Page Down schimbă luna.</p>' +
    '</div>';

  Array.prototype.forEach.call(rail.querySelectorAll('.d[data-k]'), function(b){
    b.onclick = function(){ selectDay(b.dataset.k); };
  });
  $('#cPrevM').onclick = function(){ shiftMonth(-1); };
  $('#cNextM').onclick = function(){ shiftMonth(1); };
  $('#cMon').onchange = function(){ S.calMonth = new Date(S.calMonth.getFullYear(), +this.value, 1, 12); renderCalRail(); };
  $('#cYear').onchange = function(){ S.calMonth = new Date(+this.value, S.calMonth.getMonth(), 1, 12); renderCalRail(); };
  if(prev) $('#cPrevD').onclick = function(){ selectDay(prev); };
  if(next) $('#cNextD').onclick = function(){ selectDay(next); };
  $('#cDate').onchange = function(){ if(/^\d{4}-\d{2}-\d{2}$/.test(this.value)) selectDay(this.value); };
}

function renderCalDay(){
  var key = S.calKey, dt = W.keyToDate(key), list = recs(key), n = list.length;
  var byCat = {};
  list.forEach(function(r){ var c = dayCat(r.entry, r.doc); byCat[c] = (byCat[c] || 0) + 1; });
  var parts = CATS.filter(function(c){ return byCat[c]; }).map(function(c){ return byCat[c] + ' ' + c; });

  var cards = list.map(function(r, i){
    var ms = W.markersIn(r.entry.text, S.markers), tint = false, pills = abdPill(r.entry);
    for(var k = 0; k < ms.length; k++){
      if(ms[k].tint) tint = true;
      pills += '<span class="pill" style="--mc:' + ms[k].color + '">' + esc(ms[k].word) + '</span>';
    }
    var dc = dayCat(r.entry, r.doc), c = colorOf(dc);
    return '<article class="day calcard' + (tint ? ' pf' : '') + (pills.indexOf('abdp') >= 0 ? ' abd' : '') + '" style="border-left-color:' + c + '">' +
      (r.entry.marks ? '<div class="mcj" title="Marcaj din raportul Word">' + r.entry.marks.map(esc).join(' · ') + '</div>' : '') +
      '<h4><span class="ctag" style="background:' + c + '" title="' + esc(W.CATEGORY_LABEL[dc] || dc) + '">' + esc(dc) + '</span>' +
        (dc !== r.doc.category ? '<span class="fold">folder ' + esc(r.doc.category) + '</span>' : '') +
        '<span class="wn">' + esc(r.doc.well) + '</span>' +
        '<span class="dw">' + r.period.label + ', ziua ' + r.idx + ' din ' + r.n + '</span>' + pills +
        '<span class="zi"><button class="open" data-i="' + i + '">Deschide sonda</button></span></h4>' +
      '<p>' + markup(r.entry.text, [], r.entry.abd) + '</p></article>';
  }).join('');

  var ix = ensureDayIndex();
  var prev = W.nearestDay(ix, key, -1, S.cat), next = W.nearestDay(ix, key, 1, S.cat);
  if(!n){
    cards = '<div class="none"><p>Nicio sondă nu are raport pe ' + W.fmtDate(dt) +
      (S.cat !== 'ALL' ? ' în ' + catName(S.cat) : '') + '.</p>' +
      (prev ? '<button class="plain" id="cEmptyPrev">&lsaquo; ' + W.fmtDate(W.keyToDate(prev)) + '</button> ' : '') +
      (next ? '<button class="plain" id="cEmptyNext">' + W.fmtDate(W.keyToDate(next)) + ' &rsaquo;</button>' : '') +
      '</div>';
  }

  $('#main').innerHTML =
    '<div class="head">' +
      '<div class="row1">' +
        '<h1>' + ZILE[dt.getDay()].charAt(0).toUpperCase() + ZILE[dt.getDay()].slice(1) + ', ' + W.fmtDate(dt) + '</h1>' +
        '<span class="file">' + (n ? n + ' ' + plural(n,'sondă lucrată','sonde lucrate','de sonde lucrate') +
          ' — ' + parts.join(', ') : 'fără lucrări') + '</span>' +
      '</div>' +
      '<div class="tools">' +
        '<div class="grp" role="group" aria-label="Zi">' +
          '<button id="cDayPrev" title="Ziua precedentă (săgeată stânga)">&lsaquo; Ziua precedentă</button>' +
          '<button id="cDayNext" title="Ziua următoare (săgeată dreapta)">Ziua următoare &rsaquo;</button>' +
        '</div>' +
        '<div class="grp zoom" role="group" aria-label="Mărimea textului">' +
          '<button id="fsDown" title="Micșorează textul" aria-label="Micșorează textul">&minus;</button>' +
          '<button id="fsUp" title="Mărește textul" aria-label="Mărește textul">+</button>' +
        '</div>' +
        '<span class="fs" id="fsNow"></span>' +
        '<div class="sep"></div>' +
        '<button class="plain" id="btnPrint">Tipărește</button>' +
      '</div>' +
    '</div>' +
    '<div class="sheet"><div class="grid">' + cards + '</div></div>';
  applyLook();

  $('#cDayPrev').onclick = function(){ shiftDay(-1); };
  $('#cDayNext').onclick = function(){ shiftDay(1); };
  $('#fsDown').onclick = function(){ if(S.fsDelta > FS_MIN){ S.fsDelta--; applyLook(); } };
  $('#fsUp').onclick   = function(){ if(S.fsDelta < FS_MAX){ S.fsDelta++; applyLook(); } };
  $('#btnPrint').onclick = function(){ window.print(); };
  if($('#cEmptyPrev')) $('#cEmptyPrev').onclick = function(){ selectDay(prev); };
  if($('#cEmptyNext')) $('#cEmptyNext').onclick = function(){ selectDay(next); };
  Array.prototype.forEach.call($('#main').querySelectorAll('.open[data-i]'), function(b){
    b.onclick = function(){ openFromCalendar(list[+b.dataset.i]); };
  });
  $('#main').scrollTop = 0;
}

/* Deschide sonda în pagina Sonde, direct la ziua aleasă în calendar. */
function openFromCalendar(r){
  choose(r.doc, r.period.id);
  var el = document.getElementById('d-' + r.period.id + '-' + r.idx);
  if(!el) return;
  if(el.scrollIntoView) el.scrollIntoView({ block:'center' });
  el.classList.add('flash');
  setTimeout(function(){ el.classList.remove('flash'); }, 1600);
}

/* ---------------- legături globale ---------------- */
Array.prototype.forEach.call(document.querySelectorAll('.mode'), function(b){
  b.onclick = function(e){ e.stopPropagation(); setMode(b.dataset.mode); };
});
document.addEventListener('keydown', function(e){
  if(S.mode !== 'cal' || !S.calKey) return;
  var tg = e.target && e.target.tagName;
  if(tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') return;
  var k = e.key, step = { ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7 }[k];
  if(step){ e.preventDefault(); shiftDay(step); return; }
  if(k === 'PageUp' || k === 'PageDown'){
    e.preventDefault();
    var d = W.keyToDate(S.calKey); d.setMonth(d.getMonth() + (k === 'PageUp' ? -1 : 1));
    selectDay(W.dayKey(d));
  }
});
$('#q').addEventListener('input', onQuery);
$('#q').addEventListener('focus', function(){ if(S.docs.length) openSearch(); });
$('#q').addEventListener('keydown', function(e){
  if(e.key === 'ArrowDown'){ e.preventDefault(); moveHi(1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); moveHi(-1); }
  else if(e.key === 'Enter'){ if(S.results && S.results[S.hi]) choose(S.results[S.hi].doc); }
  else if(e.key === 'Escape'){ closeSearch(); }
});
$('#qclear').onclick = function(){ $('#q').value=''; onQuery(); $('#q').focus(); };
document.addEventListener('click', function(e){
  if(!$('#finder').contains(e.target)) closeSearch();
  var pan = $('#mkpanel');
  if(pan && !pan.hidden){ pan.hidden = true; $('#btnMk').setAttribute('aria-expanded','false'); }
});
document.addEventListener('keydown', function(e){
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); $('#q').focus(); $('#q').select(); }
});
Array.prototype.forEach.call(document.querySelectorAll('.scope'), function(b){
  b.onclick = function(e){
    e.stopPropagation();
    S.cat = b.dataset.cat;
    Array.prototype.forEach.call(document.querySelectorAll('.scope'), function(x){
      x.setAttribute('aria-pressed', String(x === b));
    });
    if(S.mode === 'cal' && S.docs.length){ renderCalendar(); return; }
    if(S.docs.length){ $('#q').focus(); openSearch(); }
  };
});
$('#dirpick').addEventListener('change', function(e){ if(e.target.files.length) fromInput(e.target.files); });
$('#filepick').addEventListener('change', function(e){ if(e.target.files.length) fromInput(e.target.files); });
window.addEventListener('dragover', function(e){ e.preventDefault(); });
window.addEventListener('drop', function(e){ e.preventDefault(); });

/* lista de cuvinte marcate, dacă a fost schimbată vreodată */
kvGet('markers').then(function(list){
  if(list && list.length){
    S.markers = list.map(function(m){ return copyMarker(m); });
    if(!S.markers.some(function(m){ return m.id === 'abd'; }))
      W.DEFAULT_MARKERS.forEach(function(m){ if(m.id === 'abd') S.markers.push(copyMarker(m)); });
  }
});

/* pornire: nicio dată salvată; se șterg și eventualele date rămase de la versiunile
   anterioare (indexarea salvată și folderul reținut), apoi se cere folderul WO */
kvDel('cache'); kvDel('handle');
startNet(false);
})();
</script>
