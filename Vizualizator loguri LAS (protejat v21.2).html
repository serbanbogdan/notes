  var LS = 'VLAS.licenta.v1';
  var FOLDER_TXT = '\\\\10.11.1.13\\bkpdate\\Geologic\\Serviciul Geologic\\Aplicatii';
  var FOLDER_KEYS = ['10.11.1.13/bkpdate/geologic/serviciul geologic/aplicatii',
                     'bkpdate/geologic/serviciul geologic/aplicatii'];
  var td = new TextDecoder();

  function b64d(s) {
    s = String(s || '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  var ED_PK = b64d(ED_PK_B64);

  function folderOk() {
    var n;
    try { n = decodeURIComponent(location.href); } catch (e) { n = location.href; }
    n = n.toLowerCase().replace(/\\/g, '/');
    for (var i = 0; i < FOLDER_KEYS.length; i++) if (n.indexOf(FOLDER_KEYS[i]) >= 0) return true;
    return false;
  }
  function parseLic(txt) {
    var t = String(txt || '').replace(/\s+/g, ' ').trim();
    var m = t.match(/([A-Za-z0-9_\-]{24,})\.([A-Za-z0-9_\-]{40,})/);
    if (!m) return null;
    var payload = b64d(m[1]), sig = b64d(m[2]), obj;
    try { obj = JSON.parse(td.decode(payload)); } catch (e) { return null; }
    return { payload: payload, sig: sig, obj: obj };
  }
  function verify(lic) {
    if (!lic) return 'format';
    try { if (!nacl.sign.detached.verify(lic.payload, lic.sig, ED_PK)) return 'sig'; }
    catch (e) { return 'sig'; }
    var o = lic.obj;
    if (!o || o.v !== 1 || !o.exp || !o.m) return 'format';
    var exp = new Date(o.exp + 'T23:59:59');
    if (isNaN(exp.getTime())) return 'format';
    var today = new Date(); today.setHours(0, 0, 0, 0);
    if (exp < today) return 'expired';
    return 'ok';
  }
  function runApp(mB64) {
    var M = b64d(mB64), raw = b64d(BLOB_B64), nonce = raw.subarray(0, 24), ct = raw.subarray(24);
    var code = nacl.secretbox.open(ct, nonce, M);
    if (!code) return false;
    var s = document.createElement('script'); s.textContent = td.decode(code);

  var lock = null;
  function el(tag, attrs, html) {

  }
  function buildLock() {

    box.innerHTML = '<div style="font-size:20px;font-weight:bold;color:#203d88">Vizualizator loguri LAS</div>' +

    o.appendChild(box);

    var b = lock.querySelector('#vlasLockBody');
    if (reason === 'folder') {
      b.innerHTML = '<div style="background:#fdecec;color:#b71c1c;border-radius:6px;padding:10px 12px;margin-bottom:10px">' +

      return;

    b.innerHTML =

      '<textarea id="vlasPaste" rows="4" style="width:100%;box-sizing:border-box;font:12px Consolas,monospace;border:1px solid #c5ccd9;border-radius:5px;padding:7px"></textarea>' +
      '<div style="margin-top:10px"><button id="vlasGo" style="background:#00bc70;color:#fff;border:0;border-radius:6px;padding:9px 18px;font-weight:bold;cursor:pointer">Activează</button></div>' +

    var file = b.querySelector('#vlasFile'), paste = b.querySelector('#vlasPaste');
    file.addEventListener('change', function () {

  }
  function hideLock() { if (lock) lock.style.display = 'none'; }
  function showErr(msg) { var e = lock && lock.querySelector('#vlasErr'); if (e) e.textContent = msg || ''; }
