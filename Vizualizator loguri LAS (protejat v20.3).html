    box.style.cssText = 'background:#fff;border:1px solid #d5dbe6;border-radius:12px;box-shadow:0 10px 40px rgba(20,30,60,.18);max-width:560px;width:calc(100% - 32px);padding:26px 30px';
    box.innerHTML = '<div style="font-size:20px;font-weight:bold;color:#203d88">Vizualizator loguri LAS</div>' +
      '<div style="color:#6a7591;font-size:12px;margin:2px 0 14px">© Proprietate Șerban Bogdan – uz intern</div>' +
      '<div id="vlasLockBody" style="line-height:1.5;font-size:13.5px"></div>';
    o.appendChild(box);
    return o;
  }
  function showLock(reason) {
    if (!lock) { lock = buildLock(); document.body.appendChild(lock); }
    lock.style.display = 'flex';
    var b = lock.querySelector('#vlasLockBody');
    if (reason === 'folder') {
      b.innerHTML = '<div style="background:#fdecec;color:#b71c1c;border-radius:6px;padding:10px 12px;margin-bottom:10px">' +
        'Aplicația pornește <b>doar din folderul echipei</b>:<br><code>' + FOLDER_TXT + '</code></div>' +
        'Copiați fișierul în acel folder de rețea și deschideți-l de acolo. Rularea de pe desktop, stick sau alt calculator nu este permisă.';
      return;
    }
    b.innerHTML =
      'Aplicația necesită o <b>licență</b> emisă de Șerban Bogdan. Încărcați o singură dată fișierul <b>licenta.txt</b> (sau lipiți textul licenței) — se ține minte în acest browser până la expirare.' +
      '<div style="margin:14px 0 6px"><input type="file" id="vlasFile" accept=".txt,text/plain"></div>' +
      '<div style="margin:6px 0">sau lipiți licența:</div>' +
      '<textarea id="vlasPaste" rows="4" style="width:100%;box-sizing:border-box;font:12px Consolas,monospace;border:1px solid #c5ccd9;border-radius:5px;padding:7px"></textarea>' +
      '<div style="margin-top:10px"><button id="vlasGo" style="background:#00bc70;color:#fff;border:0;border-radius:6px;padding:9px 18px;font-weight:bold;cursor:pointer">Activează</button></div>' +
      '<div id="vlasErr" style="color:#b71c1c;margin-top:10px;min-height:18px"></div>';
    var file = b.querySelector('#vlasFile'), paste = b.querySelector('#vlasPaste');
    file.addEventListener('change', function () {
      var f = file.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () { if (!tryText(String(r.result), true)) paste.value = String(r.result); };
      r.readAsText(f);
    });
    b.querySelector('#vlasGo').addEventListener('click', function () { tryText(paste.value, true); });
  }
  function hideLock() { if (lock) lock.style.display = 'none'; }
  function showErr(msg) { var e = lock && lock.querySelector('#vlasErr'); if (e) e.textContent = msg || ''; }

  function boot(obj) {
    window.VLAS_LIC = {
      info: { exp: obj.exp, iss: obj.iss, to: obj.to },
      loadNew: function () { showLock(); },
      clear: function () { try { localStorage.removeItem(LS); } catch (e) {} location.reload(); }
    };
    if (!runApp(obj.m)) { showLock(); showErr('Cheia din licență nu se potrivește cu această versiune a aplicației. Cereți autorului licența potrivită.'); return; }
    hideLock();
  }
  function tryText(txt, fromUser) {
    var lic = parseLic(txt), r = verify(lic);
    if (r === 'ok') { try { localStorage.setItem(LS, String(txt)); } catch (e) {} boot(lic.obj); return true; }
    if (fromUser) showErr({ sig: 'Licență invalidă (semnătură greșită sau fișier modificat).', expired: 'Licența a expirat. Cereți autorului o licență nouă.', format: 'Fișierul nu este o licență validă.' }[r] || 'Licență invalidă.');
    return false;
  }

  /* descurajează inspectarea (nu e o protecție absolută în browser) */
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if (k === 'f12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) || ((e.ctrlKey || e.metaKey) && k === 'u')) e.preventDefault();
  });

  function start() {
    if (!folderOk()) { showLock('folder'); return; }
    var cached = null; try { cached = localStorage.getItem(LS); } catch (e) {}
    if (!(cached && tryText(cached, false))) showLock();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
