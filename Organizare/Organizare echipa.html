<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="color-scheme" content="light">
<title>Organizare</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2212%22%20fill=%22%23203d88%22/%3E%3Crect%20x=%2212%22%20y=%2216%22%20width=%2240%22%20height=%2236%22%20rx=%225%22%20fill=%22%23fff%22/%3E%3Crect%20x=%2212%22%20y=%2216%22%20width=%2240%22%20height=%2210%22%20rx=%225%22%20fill=%22%2354c8e8%22/%3E%3Crect%20x=%2220%22%20y=%2210%22%20width=%224%22%20height=%2212%22%20rx=%222%22%20fill=%22%23fff%22/%3E%3Crect%20x=%2240%22%20y=%2210%22%20width=%224%22%20height=%2212%22%20rx=%222%22%20fill=%22%23fff%22/%3E%3Cpath%20d=%22M21%2039l7%207%2015-15%22%20fill=%22none%22%20stroke=%22%2300bc70%22%20stroke-width=%225.5%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<style>
/* Organizare echipă — Serviciul Geologic. Identitate vizuală ROMGAZ: albastru #203d88, verde #00bc70, cyan #54c8e8,
   portocaliu #ee7623 (rezervat pentru „cere atenție acum”), gri #808080; font Trebuchet MS. */
:root {
  --albastru: #203d88; --albastru-inchis: #17306c; --albastru-mediu: #3d5aa8; --albastru-deschis: #8fa2d8;
  --albastru-50: #f1f4fb; --albastru-100: #e3e9f6; --albastru-200: #c7d2ec;
  --verde: #00bc70; --verde-inchis: #00804c; --verde-50: #e5f8ef;
  --cyan: #54c8e8; --cyan-inchis: #157e9e; --cyan-50: #e8f7fc;
  --portocaliu: #ee7623; --portocaliu-inchis: #b4520e; --portocaliu-50: #fdf1e8; --portocaliu-100: #fbdcc6;
  --gri: #808080; --gri-text: #5f6470; --gri-50: #f5f6f8; --gri-100: #eceef2; --gri-200: #d8dce3;
  --text: #1a2747; --fond: #f4f6fa; --panou: #ffffff; --linie: #dde3ee;
  --font: "Trebuchet MS", "Lucida Grande", "Lucida Sans Unicode", "Segoe UI", sans-serif;
    --marime: 14px;
}
* { box-sizing: border-box; }
html { font-size: var(--marime); }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--fond); line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; font-weight: bold; line-height: 1.25; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--albastru); }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
::selection { background: var(--cyan-50); }
.sari { position: absolute; left: -9999px; top: .5rem; z-index: 200; background: #fff; color: var(--albastru); padding: .5rem .9rem; border-radius: 6px; font-weight: bold; }
.sari:focus { left: .5rem; }
.rapid { margin: -.2rem 0 .8rem; }
.rapid input { border-style: dashed; border-color: var(--albastru-200); background: var(--albastru-50); }
.rapid input:focus { border-style: solid; background: #fff; }
.rapid-previz { min-height: 1.3em; margin-top: .25rem; }
.antet-tipar { display: none; }
#zona-tipar { display: none; }
.vizual-ascuns { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- butoane ---------- */
.btn { display: inline-flex; align-items: center; gap: .45em; border: 1px solid var(--albastru-200); background: #fff; color: var(--albastru); border-radius: 6px; padding: .42em .9em; cursor: pointer; font-weight: bold; white-space: nowrap; line-height: 1.2; }
.btn:hover { background: var(--albastru-50); border-color: var(--albastru-deschis); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.principal { background: var(--albastru); color: #fff; border-color: var(--albastru); }
.btn.principal:hover { background: var(--albastru-inchis); }
.btn.verde { background: var(--verde-inchis); border-color: var(--verde-inchis); color: #fff; }
.btn.verde:hover { background: #006b3f; }
.btn.atentie { color: var(--portocaliu-inchis); border-color: var(--portocaliu-100); }
.btn.atentie:hover { background: var(--portocaliu-50); }
.btn.simplu { border-color: transparent; background: transparent; }
.btn.simplu:hover { background: var(--albastru-50); }
.btn.mic { padding: .25em .6em; font-size: .9em; }
.btn .ic { font-size: 1.05em; line-height: 1; }
.grup-btn { display: inline-flex; border: 1px solid var(--albastru-200); border-radius: 6px; overflow: hidden; }
.grup-btn button { border: 0; background: #fff; padding: .4em .8em; cursor: pointer; color: var(--albastru); font-weight: bold; border-left: 1px solid var(--albastru-100); }
.grup-btn button:first-child { border-left: 0; }
.grup-btn button[aria-pressed="true"] { background: var(--albastru); color: #fff; }
.grup-btn button:hover:not([aria-pressed="true"]) { background: var(--albastru-50); }

/* ---------- câmpuri ---------- */
.camp { display: flex; flex-direction: column; gap: .25em; min-width: 0; }
.camp > label, .camp > .eticheta { font-weight: bold; font-size: .92em; }
.camp .ajutor { color: var(--gri-text); font-size: .86em; }
input[type=text], input[type=password], input[type=date], input[type=number], input[type=search], select, textarea {
  border: 1px solid var(--gri-200); border-radius: 5px; padding: .42em .55em; background: #fff; min-width: 0; width: 100%;
}
textarea { resize: vertical; min-height: 4.2em; }
input:hover, select:hover, textarea:hover { border-color: var(--albastru-deschis); }
input:focus, select:focus, textarea:focus { border-color: var(--albastru); outline: 2px solid var(--cyan-50); }
.camp.eroare input, .camp.eroare select { border-color: var(--portocaliu); }
.mesaj-eroare { color: var(--portocaliu-inchis); font-size: .9em; }
.grila { display: grid; gap: .9em 1em; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.rand-flex { display: flex; gap: .6em; align-items: center; flex-wrap: wrap; }
.spatiu { flex: 1; }
.bifa { display: inline-flex; gap: .45em; align-items: center; cursor: pointer; }
.bifa input { width: 1.05em; height: 1.05em; accent-color: var(--albastru); }

/* ---------- pornire / autentificare ---------- */
.ecran-pornire { min-height: 100vh; display: grid; grid-template-columns: minmax(280px, 420px) minmax(320px, 560px); justify-content: center; align-content: center; gap: 3rem; padding: 2rem; background: #fff; }
.pornire-stanga { border-left: 6px solid var(--albastru); padding: .3rem 0 .3rem 1.4rem; align-self: start; margin-top: 1rem; }
.pornire-stanga .marca { color: var(--gri-text); font-size: .92em; }
.pornire-stanga h1 { font-size: 2.1rem; color: var(--albastru); margin: .35em 0 .15em; letter-spacing: -.01em; }
.pornire-stanga .sub { font-size: 1.15rem; color: var(--text); }
.pornire-stanga .versiune { margin-top: 2.2rem; color: var(--gri-text); font-size: .85em; }
.pornire-stanga .unda { margin-top: 1.4rem; height: 46px; width: 100%; max-width: 330px; display: block; }
.pornire-dreapta h2 { font-size: 1.2rem; margin-bottom: .9rem; }
.lista-utilizatori { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
.card-utilizator { text-align: left; border: 1px solid var(--linie); background: #fff; border-radius: 8px; padding: .75rem .9rem; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: .1rem .7rem; align-items: center; }
.card-utilizator:hover { border-color: var(--albastru-deschis); background: var(--albastru-50); }
.card-utilizator[aria-pressed="true"] { border-color: var(--albastru); box-shadow: inset 0 0 0 1px var(--albastru); background: var(--albastru-50); }
.card-utilizator .init { grid-row: span 2; }
.card-utilizator .nume { font-weight: bold; font-size: 1.05em; }
.card-utilizator .sectii { color: var(--gri-text); font-size: .88em; }
.formular-pin { margin-top: 1rem; border-top: 1px solid var(--linie); padding-top: 1rem; display: grid; gap: .7rem; max-width: 360px; }
.formular-pin input { font-size: 1.4rem; letter-spacing: .35em; text-align: center; }
.panou-folder { border: 1px solid var(--albastru-200); background: var(--albastru-50); border-radius: 8px; padding: 1rem 1.1rem; margin-bottom: 1.2rem; display: grid; gap: .6rem; }
.panou-folder code, .cale { font-family: Consolas, "Lucida Console", monospace; font-size: .9em; background: #fff; border: 1px solid var(--linie); border-radius: 4px; padding: .1em .35em; overflow-wrap: anywhere; }

/* ---------- inițiale membri ---------- */
.init { display: inline-grid; place-items: center; width: 2em; height: 2em; border-radius: 50%; color: #fff; font-weight: bold; font-size: .85em; flex: none; background: var(--c, var(--gri)); }
.init.mic { width: 1.55em; height: 1.55em; font-size: .72em; }
.init.deschis { color: var(--text); }
.m-bogdan { --c: #203d88; --c-rgb: 32, 61, 136; } .m-cami { --c: #00bc70; --c-rgb: 0, 188, 112; } .m-adriana { --c: #54c8e8; --c-rgb: 84, 200, 232; }
.m-andrea { --c: #7f95d6; --c-rgb: 127, 149, 214; } .m-sile { --c: #00804c; --c-rgb: 0, 128, 76; } .m-cristi { --c: #157e9e; --c-rgb: 21, 126, 158; }
.m-nealocat { --c: #808080; --c-rgb: 128, 128, 128; }
.init.m-adriana, .init.m-cami, .init.m-andrea { color: #10203f; }

/* ---------- bara de sus ---------- */
.bara { position: sticky; top: 0; z-index: 20; background: var(--albastru); color: #fff; display: flex; align-items: stretch; gap: 1.2rem; padding: 0 1.2rem; min-height: 3.4rem; }
.bara .titlu { display: flex; flex-direction: column; justify-content: center; line-height: 1.15; padding-right: .4rem; }
.bara .titlu b { font-size: 1.08em; }
.bara .titlu span { font-size: .8em; opacity: .82; }
.bara nav { display: flex; align-items: stretch; gap: .1rem; flex-wrap: wrap; }
.bara nav button { background: transparent; border: 0; color: #fff; opacity: .86; padding: 0 .85rem; cursor: pointer; font-weight: bold; border-bottom: 3px solid transparent; border-top: 3px solid transparent; }
.bara nav button:hover { opacity: 1; background: rgba(255, 255, 255, .07); }
.bara nav button[aria-current="page"] { opacity: 1; border-bottom-color: var(--verde); }
.bara nav .numar { display: inline-block; min-width: 1.5em; padding: 0 .35em; border-radius: 1em; background: var(--portocaliu); color: #fff; font-size: .78em; margin-left: .3em; text-align: center; }
.bara .dreapta { margin-left: auto; display: flex; align-items: center; gap: .7rem; }
.btn-calendar { background: #fff; color: var(--albastru); border: 0; border-radius: 6px; padding: .5em 1.05em; font-weight: bold; cursor: pointer; display: inline-flex; gap: .5em; align-items: center; font-size: 1.02em; }
.btn-calendar:hover { background: var(--verde-50); }
.stare-salvare { font-size: .82em; display: inline-flex; align-items: center; gap: .4em; opacity: .9; white-space: nowrap; }
.stare-salvare .punct { width: .6em; height: .6em; border-radius: 50%; background: var(--verde); }
.stare-salvare.salvez .punct { background: var(--cyan); }
.stare-salvare.eroare .punct { background: var(--portocaliu); }
.stare-salvare.eroare { opacity: 1; font-weight: bold; }
.btn-utilizator { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .25); color: #fff; border-radius: 2em; padding: .2em .8em .2em .25em; display: inline-flex; gap: .45em; align-items: center; cursor: pointer; font-weight: bold; }
.btn-utilizator:hover { background: rgba(255, 255, 255, .18); }
.meniu { position: absolute; right: 1rem; top: 3.2rem; background: #fff; color: var(--text); border: 1px solid var(--linie); border-radius: 8px; min-width: 210px; padding: .35rem; box-shadow: 0 10px 30px rgba(23, 48, 108, .18); z-index: 40; }
.meniu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: .55em .8em; border-radius: 5px; cursor: pointer; }
.meniu button:hover { background: var(--albastru-50); }
.meniu hr { border: 0; border-top: 1px solid var(--linie); margin: .3rem 0; }

/* ---------- pagină ---------- */
main { padding: 1.4rem 1.6rem 3rem; max-width: 1500px; margin: 0 auto; }
.antet-pagina { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.1rem; }
.antet-pagina h1 { font-size: 1.55rem; color: var(--albastru); }
.antet-pagina .detalii { color: var(--gri-text); }
.sectiune { background: var(--panou); border: 1px solid var(--linie); border-top: 3px solid var(--albastru); border-radius: 3px; padding: 1rem 1.1rem; min-width: 0; }
.sectiune > header { display: flex; align-items: baseline; gap: .8rem; margin-bottom: .75rem; flex-wrap: wrap; }
.sectiune > header h2 { font-size: 1.08rem; }
.sectiune > header .detalii { color: var(--gri-text); font-size: .9em; }
.sectiune.liniste { border-top-color: var(--albastru-200); }
.doua-coloane { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, 1fr); gap: 1.1rem; align-items: start; }
.stiva { display: grid; gap: 1.1rem; align-content: start; min-width: 0; }
.gol { color: var(--gri-text); padding: .9rem 0; }
.gol b { color: var(--text); }
.salut { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem 1.2rem; margin-bottom: 1.1rem; }
.salut h1 { font-size: 1.7rem; color: var(--albastru); letter-spacing: -.01em; }
.salut .zi { color: var(--gri-text); font-size: 1.05em; }

/* ---------- alerte ---------- */
.alerte { display: grid; gap: .5rem; margin-bottom: 1.1rem; }
.alerta { display: flex; gap: .8rem; align-items: center; padding: .65rem .9rem; border-radius: 6px; background: var(--albastru-50); border: 1px solid var(--albastru-100); flex-wrap: wrap; }
.alerta.urgent { background: var(--portocaliu-50); border-color: var(--portocaliu-100); }
.alerta.urgent .ic { color: var(--portocaliu-inchis); }
.alerta.bine { background: var(--verde-50); border-color: #bfeedb; }
.alerta .ic { font-size: 1.2em; }
.alerta .text { flex: 1; min-width: 220px; }

/* ---------- ceasurile de 180 de zile ---------- */
.ceasuri { display: grid; gap: .15rem; }
.ceas { display: grid; grid-template-columns: minmax(150px, 210px) minmax(160px, 1fr) 7.6em; gap: .25rem 1rem; align-items: center; padding: .5rem .45rem; border-radius: 5px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.ceas:hover { background: var(--albastru-50); }
.ceas .cine { display: flex; gap: .55rem; align-items: center; min-width: 0; }
.ceas .cine .t { min-width: 0; }
.ceas .sonda { font-weight: bold; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ceas .tip { color: var(--gri-text); font-size: .84em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pista { position: relative; height: 12px; background: var(--albastru-100); border-radius: 6px; overflow: visible; }
.pista .umplut { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--albastru-mediu); }
.pista .reper { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--albastru); opacity: .55; }
.pista .reper.final { background: var(--text); opacity: .7; }
.pista .acum { position: absolute; top: -5px; width: 4px; height: 22px; margin-left: -2px; border-radius: 2px; background: var(--text); }
.ceas.atentie .umplut { background: var(--portocaliu); }
.ceas.depasit .pista { background: var(--portocaliu-100); }
.ceas.depasit .umplut { background: repeating-linear-gradient(135deg, var(--portocaliu) 0 6px, var(--portocaliu-inchis) 6px 12px); width: 100% !important; }
.ceas .zile { text-align: right; line-height: 1.15; }
.ceas .zile b { font-size: 1.15em; display: block; }
.ceas .zile span { font-size: .8em; color: var(--gri-text); }
.ceas.atentie .zile b, .ceas.depasit .zile b { color: var(--portocaliu-inchis); }
.legenda-ceas { display: flex; gap: 1.2rem; flex-wrap: wrap; color: var(--gri-text); font-size: .84em; margin-top: .6rem; }
.legenda-ceas i { display: inline-block; width: 1.6em; height: .55em; border-radius: 3px; vertical-align: middle; margin-right: .35em; }

/* ---------- liste de sarcini ---------- */
.grup-sarcini + .grup-sarcini { margin-top: .9rem; }
.grup-sarcini h3 { font-size: .95em; color: var(--gri-text); margin-bottom: .35rem; display: flex; gap: .5rem; align-items: center; }
.grup-sarcini.depasite h3 { color: var(--portocaliu-inchis); }
.sarcina { display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .7rem; align-items: start; padding: .5rem .4rem; border-bottom: 1px solid var(--gri-100); }
.sarcina:last-child { border-bottom: 0; }
.sarcina .bifa-sarcina { margin-top: .15em; width: 1.15em; height: 1.15em; accent-color: var(--verde-inchis); cursor: pointer; }
.sarcina .corp { min-width: 0; cursor: pointer; }
.sarcina .titlu-s { font-weight: bold; }
.sarcina .titlu-s:hover { text-decoration: underline; }
.sarcina .meta { color: var(--gri-text); font-size: .86em; display: flex; flex-wrap: wrap; gap: .1rem .8rem; }
.sarcina.gata .titlu-s { text-decoration: line-through; color: var(--gri-text); font-weight: normal; }
.sarcina .termen-s { white-space: nowrap; font-size: .9em; text-align: right; }
.sarcina .termen-s.depasit { color: var(--portocaliu-inchis); font-weight: bold; }
.eticheta-cat { display: inline-block; padding: 0 .5em; border-radius: 3px; font-size: .8em; background: var(--albastru-50); color: var(--albastru); border: 1px solid var(--albastru-100); white-space: nowrap; }
.eticheta-cat.anrmpsg { background: var(--albastru); color: #fff; border-color: var(--albastru); }
.eticheta-cat.date_program { background: var(--verde-50); color: var(--verde-inchis); border-color: #bfeedb; }
.eticheta-cat.comanda { background: var(--cyan-50); color: var(--cyan-inchis); border-color: #c4ecf8; }
.eticheta-cat.studiu { background: var(--albastru-100); color: var(--albastru-inchis); border-color: var(--albastru-200); }
.urgent-mark { color: var(--portocaliu-inchis); font-weight: bold; }

/* ---------- pastile de stare ---------- */
.pastila { display: inline-flex; align-items: center; gap: .35em; padding: .08em .6em; border-radius: 1em; font-size: .84em; font-weight: bold; white-space: nowrap; border: 1px solid transparent; }
.pastila::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: currentColor; }
.st-depasit, .st-expirat { background: var(--portocaliu); color: #fff; }
.st-depasit::before, .st-expirat::before { background: #fff; }
.st-atentie { background: var(--portocaliu-50); color: var(--portocaliu-inchis); border-color: var(--portocaliu-100); }
.st-in_termen { background: var(--albastru-50); color: var(--albastru); border-color: var(--albastru-100); }
.st-finalizat, .st-depus { background: var(--verde-50); color: var(--verde-inchis); border-color: #bfeedb; }
.st-fara_data { background: var(--gri-50); color: var(--gri-text); border-color: var(--gri-200); }
.st-asteapta { background: var(--albastru-50); color: var(--gri-text); border-color: var(--albastru-100); }
.st-suspendat { background: var(--gri-100); color: var(--text); border-color: var(--gri-200); }

/* ---------- bara de filtre ---------- */
.filtre { display: flex; gap: .55rem; align-items: center; flex-wrap: wrap; margin-bottom: .9rem; }
.filtru-stare { border: 1px solid var(--linie); background: #fff; border-radius: 2em; padding: .28em .8em; cursor: pointer; display: inline-flex; gap: .45em; align-items: center; }
.filtru-stare b { font-size: 1.02em; }
.filtru-stare[aria-pressed="true"] { border-color: var(--albastru); background: var(--albastru); color: #fff; }
.filtru-stare.portocaliu b { color: var(--portocaliu-inchis); }
.filtru-stare.portocaliu[aria-pressed="true"] { background: var(--portocaliu-inchis); border-color: var(--portocaliu-inchis); }
.filtru-stare.portocaliu[aria-pressed="true"] b { color: #fff; }
.cautare { max-width: 260px; }
.cip-membru { border: 1px solid var(--linie); background: #fff; border-radius: 2em; padding: .2em .7em .2em .25em; cursor: pointer; display: inline-flex; gap: .4em; align-items: center; font-weight: bold; }
.cal-filtre:not(.toti) .cip-membru[aria-pressed="false"] { opacity: .55; }
.cal-filtre:not(.toti) .cip-membru[aria-pressed="false"] .init { background: var(--gri-200); color: var(--gri-text); }
.cip-membru[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }

/* ---------- tabele ---------- */
.tabel-cadru { overflow: auto; border: 1px solid var(--linie); border-radius: 4px; background: #fff; max-height: calc(100vh - 15rem); }
table.tabel { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .93em; }

<script>
// ===== core.js =====
// Funcții de bază: codare text, CSV, date (inclusiv seriale Excel), numere, sărbători legale, săptămâni ISO.
(function (root) {

  // UTF-8 (cu sau fără BOM), UTF-16 LE/BE cu BOM, altfel Windows-1250 / Windows-1252 (ANSI, cum salvează Excel „CSV”).

    out[0] = 0xEF; out[1] = 0xBB; out[2] = 0xBF; out.set(e, 3);

  }

  // ---------- CSV ----------

  // lista de decizii a șefului (Echipa A „De decis” + Echipa B „Clarificare inițială”)

        var val = t.type === 'checkbox' ? (t.checked ? true : null) : t.value.trim();
        seteazaStareTarif(t.dataset.cheie, t.dataset.camp, val === '' ? null : val);
        S.deRedesenat = false; redeseneaza(); break;
      }
      case 'echipa-sectie': {
        var lista = membri().map(function (m) { return { id: m.id, nume: m.nume, rol: m.rol, sectii: (m.sectii || []).slice() }; });
        var mm = lista.filter(function (m) { return m.id === t.dataset.id; })[0];
        if (t.checked) { if (mm.sectii.indexOf(t.dataset.s) < 0) mm.sectii.push(t.dataset.s); } else mm.sectii = mm.sectii.filter(function (s) { return s !== t.dataset.s; });
        salveazaMembri(lista); redeseneaza(); toast('Repartizarea secțiilor a fost salvată.', 'bine'); break;
      }
      case 'email-serviciu': { var o = {}; o[t.dataset.k] = t.value.trim(); scrie('setari:echipa', o); toast('Adresa a fost salvată.', 'bine'); break; }
      case 'zile-avize': { var z = Math.max(0, Math.min(365, parseInt(t.value, 10) || 0)); scrie('setari:echipa', { zileAvize: z }); analizeazaAvize(); redeseneaza(); break; }
    }
  });
  // panou kanban: tragere între coloane
  document.addEventListener('dragstart', function (e) { var c = e.target.closest && e.target.closest('.carte'); if (c) { e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; } });
  document.addEventListener('dragover', function (e) { var col = e.target.closest && e.target.closest('.coloana'); if (col) { e.preventDefault(); col.classList.add('peste'); } });
  document.addEventListener('dragleave', function (e) { var col = e.target.closest && e.target.closest('.coloana'); if (col) col.classList.remove('peste'); });
  document.addEventListener('drop', function (e) {
    var col = e.target.closest && e.target.closest('.coloana'); if (!col) return;
    e.preventDefault(); var id = e.dataTransfer.getData('text/plain'), s = S.dep.get(id);
    if (!s || !poateModificaSarcina(s)) return;
    var nou = col.dataset.coloana;
    if (nou === 'finalizata') bifeazaSarcina(id, true);
    else if (nou === 'astept') modalSarcina(id, null, { stare: 'astept' });
    else { if (nou === 'in_lucru') avertizeazaInLucru(s.responsabil, id); scrie(id, { stare: nou, finalizatLa: null }); redeseneaza(); }
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && t.dataset && t.dataset.i === 'rapid' && e.key === 'Enter') { e.preventDefault(); adaugaRapid(t, e.shiftKey); return; }
    if (S.etapa === 'login' && !stivaModal.length && !(t && /^(INPUT|TEXTAREA)$/.test(t.tagName)) && /^[1-9]$/.test(e.key)) {
      var mm = membri()[+e.key - 1]; if (mm) { S.loginSel = mm.id; S.loginEroare = ''; redeseneaza(); } return;
    }
    if (S.etapa !== 'app' || stivaModal.length || e.ctrlKey || e.altKey || e.metaKey) return;
    var a = document.activeElement;
    if (a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable)) return;
    if (window.Calendar && Calendar.deschis()) return;
    if (e.key === 'c' || e.key === 'C') { e.preventDefault(); deschideCalendar(); }
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); modalSarcina(null); }
  });

  // ---------- calendarul ----------
  function deschideCalendar(z) {
    Calendar.deschide({
      azi: function () { return S.azi; },
      evenimente: evenimente,
      membri: membri,
      eu: function () { return S.eu; },
      numeM: numeM, badge: badge, clsM: clsM, esteSef: esteSef,
      deschideEveniment: function (ev) {
        if (ev.tip === 'sarcina') modalSarcina(ev.id);
        else if (ev.tip === 'revenire_sarcina') modalSarcina(ev.sursa.id);
        else if (ev.tip === 'termen' || ev.tip === 'reamintire' || ev.tip === 'revenire' || ev.tip === 'reverificare') { Calendar.inchide(); S.vedere = 'tarife'; S.f.tarStare = 'toate'; deschidePanou('tarif', ev.cheie); }
        else if (ev.experimentala) { Calendar.inchide(); S.vedere = 'experimentale'; deschidePanou('experimentala', ev.cheie); }
        else if (ev.conservare) { Calendar.inchide(); S.vedere = 'conservare'; deschidePanou('conservare', ev.cheie); }
        else { Calendar.inchide(); S.vedere = 'avize'; deschidePanou('aviz', ev.cheie); }
      },
      bifeaza: function (ev, gata) { if (ev.tip === 'sarcina') { bifeazaSarcina(ev.id, gata); Calendar.redeseneaza(); } },
      poateBifa: function (ev) { return ev.tip === 'sarcina' && poateModificaSarcina(ev.sursa); },
      sarcinaNoua: function (z) { modalSarcina(null, { termen: B.isoData(z) }); },
      laInchidere: function () { redeseneaza(); }
    }, z);
  }
  window.addEventListener('org-redeseneaza', function () { if (window.Calendar && Calendar.deschis()) Calendar.redeseneaza(); });

  // ---------- pornire ----------
  window.__test = { S: S, B: B, scrie: scrie, salveazaPropriu: salveazaPropriu, verificaSchimbari: verificaSchimbari, evenimente: evenimente, redeseneaza: redeseneaza, salveazaCSV: salveazaCSV, editeazaCelula: editeazaCelula };
  pornire();
})();

</script>
