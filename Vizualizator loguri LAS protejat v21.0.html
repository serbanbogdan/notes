  var td = new TextDecoder();

  function b64d(s) {
    s = String(s || '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);

  }
  function parseLic(txt) {
    var t = String(txt || '').replace(/\s+/g, ' ').trim();
    var m = t.match(/([A-Za-z0-9_\-]{24,})\.([A-Za-z0-9_\-]{40,})/);
    if (!m) return null;
    var payload = b64d(m[1]), sig = b64d(m[2]), obj;
    try { obj = JSON.parse(td.decode(payload)); } catch (e) { return null; }
    return { payload: payload, sig: sig, obj: obj };
  }
  function verify(lic) {
    if (!lic) return 'format';
    try { if (!nacl.sign.detached.verify(lic.payload, lic.sig, ED_PK)) return 'sig'; }
    catch (e) { return 'sig'; }
    var o = lic.obj;
    if (!o || o.v !== 1 || !o.exp || !o.m) return 'format';
    var exp = new Date(o.exp + 'T23:59:59');
    if (isNaN(exp.getTime())) return 'format';
    var today = new Date(); today.setHours(0, 0, 0, 0);
    if (exp < today) return 'expired';
    return 'ok';
  }

  function hideLock() { if (lock) lock.style.display = 'none'; }
